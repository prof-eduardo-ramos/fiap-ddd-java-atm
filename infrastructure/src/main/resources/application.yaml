spring:
    application:
        name: fiap-ddd-java-atm-infra
    datasource:
        url: jdbc:h2:~/fiapbank-h2.db
        username: sa
        password: admin
        driver-class-name: org.h2.Driver
    jpa:
        database-platform: org.hibernate.dialect.H2Dialect
        hibernate:
            ddl-auto: update
        show-sql: true
