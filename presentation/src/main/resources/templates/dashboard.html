<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>FIAP Bank - Dashboard</title>
    <meta charset="UTF-8" />
    <style>
        .card {
            border: 1px solid #ccc;
            padding: 15px;
            border-radius: 5px;
            width: 350px;
            margin-bottom: 20px;
        }

        .extrato-table {
            border-collapse: collapse;
            width: 350px;
            text-align: left;
        }

        .extrato-table th,
        .extrato-table td {
            padding: 8px;
            border-bottom: 1px solid #ddd;
        }

        .extrato-table th {
            background-color: #f2f2f2;
        }
    </style>
</head>

<body style="font-family: Arial, sans-serif; margin: 0;">

    <!-- Importa a NavBar do fragmento -->
    <div th:replace="~{fragments/cabecalho :: navbar}"></div>

    <div style="padding: 20px;">
        <!-- Mensagem de Sucesso (vinda do RedirectAttributes) -->
        <div th:if="${mensagemSucesso}" th:text="${mensagemSucesso}"
            style="background-color: #d4edda; color: #155724; padding: 10px; margin-bottom: 20px; width: 330px;">
        </div>

        <h3>Resumo da Conta</h3>

        <div class="card">
            <p><strong>Cliente:</strong> <span th:text="${conta.nomeCliente}">Nome</span></p>
            <p><strong>Conta:</strong> <span th:text="${conta.numero}">00000-0</span></p>
            <p><strong>Agencia:</strong> <span th:text="${conta.agencia}">0000</span></p>
            <h2 style="color: #E91E63;">
                Saldo: R$ <span th:text="${#numbers.formatDecimal(conta.saldo, 1, 'POINT', 2, 'COMMA')}">0.00</span>
            </h2>
        </div>

        <h3>Últimas Movimentações</h3>
        <table class="extrato-table">
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Tipo</th>
                    <th>Valor (R$)</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${extrato.empty}">
                    <td colspan="3" style="text-align: center; color: #777;">Nenhuma movimentação.</td>
                </tr>
                <!-- Iteração das movimentações consultadas via ContaService -->
                <tr th:each="mov : ${extrato}">
                    <td th:text="${#temporals.format(mov.dataHora, 'dd/MM/yyyy HH:mm')}">01/01</td>
                    <td th:text="${mov.tipoMovimentacao}">SAQUE</td>
                    <td th:text="${#numbers.formatDecimal(mov.valor, 1, 'POINT', 2, 'COMMA')}">0.00</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>

</html>
