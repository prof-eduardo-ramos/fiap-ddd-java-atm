<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>FIAP Bank - Dashboard</title>
    <meta charset="UTF-8" />
    <style>
        .card {
            border: 1px solid #ccc;
            padding: 15px;
            border-radius: 5px;
            width: 350px;
            margin-bottom: 20px;
        }

        .extrato-table {
            border-collapse: collapse;
            width: 350px;
            text-align: left;
        }

        .extrato-table th,
        .extrato-table td {
            padding: 8px;
            border-bottom: 1px solid #ddd;
        }

        .extrato-table th {
            background-color: #f2f2f2;
        }
    </style>
</head>

<body style="font-family: Arial, sans-serif; margin: 0;">
    <nav style="background-color: #E91E63; color: white; padding: 15px;">
        <h2>🏦 FIAP Bank ATM - Web Console</h2>
    </nav>
    <div style="padding: 20px;">
        <!-- Mensagem de Sucesso (vinda do RedirectAttributes) -->
        <div th:if="${mensagemSucesso}" th:text="${mensagemSucesso}"
            style="background-color: #d4edda; color: #155724; padding: 10px; margin-bottom: 20px; width: 330px;">
        </div>

        <h3>Lista de Contas</h3>

        <table class="extrato-table">
            <thead>
                <tr>
                    <th>ID Conta</th>
                    <th>Cliente</th>
                    <th>Saldo (R$)</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${contas.empty}">
                    <td colspan="3" style="text-align: center; color: #777;">Nenhuma conta cadastrada.</td>
                </tr>
                <!-- Iteração das movimentações consultadas via ContaService -->
                <tr th:each="conta : ${contas}">
                    <td><a th:href="@{/internet-banking/{id}(id=${conta.id})}" th:text="${conta.id}">00000-0</a></td>
                    <td th:text="${conta.nomeCliente}">Nome</td>
                    <td th:text="${#numbers.formatDecimal(conta.saldo, 1, 'POINT', 2, 'COMMA')}">0.00</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>

</html>
