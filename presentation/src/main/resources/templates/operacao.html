<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>FIAP Bank - Operação</title>
    <meta charset="UTF-8" />
    <style>
        .error-msg {
            color: red;
            font-size: 0.9em;
            display: block;
            margin-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }
    </style>
</head>

<body style="font-family: Arial, sans-serif; margin: 0;">

    <div th:replace="~{fragments/cabecalho :: navbar}"></div>

    <div style="padding: 20px;">
        <h3>Realizar Operação Bancária</h3>

        <!-- Mensagem de erro de negócio (ex: Saldo Insuficiente) -->
        <div th:if="${mensagemErro}" th:text="${mensagemErro}"
            style="background-color: #f8d7da; color: #721c24; padding: 10px; margin-bottom: 20px; width: 280px;">
        </div>

        <!-- Formulário ligado ao DTO via th:object -->
        <form th:action="@{/internet-banking/{id}/operacao(id=${conta.id})}" th:object="${operacaoForm}" method="post"
            style="width: 300px;">

            <div class="form-group">
                <label>Tipo de Operação:</label><br />
                <select th:field="*{tipoOperacao}">
                    <option value="SAQUE">Saque</option>
                    <option value="DEPOSITO">Depósito</option>
                </select>
            </div>

            <div class="form-group">
                <label>Valor (R$):</label><br />
                <input type="number" step="0.01" th:field="*{valor}" /><br />
                <span class="error-msg" th:if="${#fields.hasErrors('valor')}" th:errors="*{valor}"></span>
            </div>

            <button type="submit"
                style="background-color: #E91E63; color: white; border: none; padding: 10px 20px; cursor: pointer;">
                Confirmar Operação
            </button>
        </form>
    </div>
</body>

</html>
