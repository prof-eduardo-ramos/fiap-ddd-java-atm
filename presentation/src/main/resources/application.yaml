spring:
    application:
        name: fiap-ddd-java-atm
    datasource:
        url: jdbc:h2:mem:fiapbankdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
        driver-class-name: org.h2.Driver
        username: sa
        password: admin
    jpa:
        database-platform: org.hibernate.dialect.H2Dialect
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                format_sql: true
    h2:
        enabled: true
        path: /h2-console
