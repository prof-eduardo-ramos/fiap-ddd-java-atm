spring:
    application:
        name: fiap-ddd-java-atm
    datasource:
        url: jdbc:h2:./data/fiapbank-h2
        username: sa
        password: admin
        driver-class-name: org.h2.Driver
    jpa:
        database-platform: org.hibernate.dialect.H2Dialect
        hibernate:
            ddl-auto: update
        show-sql: true
    h2:
        console:
            enabled: true
            path: /h2-console
